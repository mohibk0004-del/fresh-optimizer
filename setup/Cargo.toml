[package]
name = "freshoptimizer-setup"
version = "0.4.0"
description = "FreshOptimizer Setup"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
