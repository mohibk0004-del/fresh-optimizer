[package]
name = "freshoptimizer"
version = "0.3.0"
description = "FreshOptimizer - anti-cheat safe latency tuning for competitive FPS"
edition = "2021"

[lib]
name = "freshoptimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
winreg = "0.55"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
